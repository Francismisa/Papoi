<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Educación Cultural</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    .galeria { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1.5rem; }
    figure { flex: 1 1 280px; margin: 0; }
    img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
    figcaption { font-size: 0.9rem; color: #555; margin-top: 0.4rem; }
  </style>
</head>
<body>
  <h1>Educación Cultural</h1>
  <p>La educación cultural fomenta el respeto, la empatía y el conocimiento de nuestras tradiciones y diversidad.</p>

  <div class="galeria">
    <figure>
      <!-- Cambia el src por la ruta o URL de tu primera imagen -->
      <img src="imagenes/cultura2.jpg" alt="Culturas distintas señalando origen" />
      <figcaption>Patrimonio y expresión artística</figcaption>
    </figure>
    <figure>
      <!-- Cambia el src por la ruta o URL de tu segunda imagen -->
      <img src="imagenes/cultura.jpg" alt="Encuentro comunitario y diversidad cultural" />
      <figcaption>Convivencia e intercambio cultural</figcaption>
    </figure>
  </div>
</body>
</html>
